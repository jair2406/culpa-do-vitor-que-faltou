<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Nova Ação - Mural do Bairro</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="linha-superior-header">
      <img src="imagens/colegio-civico-militar-do-parana-logo.png" alt="Logo Colégio Cívico-Militar do Paraná" class="logo-esquerda">
      <div class="titulos-header">
        <h1>Mural de Ações do Bairro</h1>
        <p>Um registro das ações realizadas pelos moradores da Vila Nova.</p>
      </div>
      <img src="imagens/governo_estado.png" alt="Logo Governo do Estado" class="logo-direita">
    </div>
    <div class="imagem-destaque">
      <img src="imagens/OIG2.YvLhU.uTkxg.jfif" alt="Ação Comunitária - Unidos pela Cidade">
    </div>
  </header>

  <main>
    <section aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Cadastrar uma ação</h2>
      <form id="formulario-acao">
        <div>
          <label for="titulo-acao">Título da ação</label>
          <input type="text" id="titulo-acao" name="titulo" required>
        </div>
        <div>
          <label for="categoria-acao">Categoria</label>
          <select id="categoria-acao" name="categoria" required>
            <option value="">Escolha uma categoria</option>
            <option value="Ambiental">Ambiental</option>
            <option value="Social">Social</option>
            <option value="Educação">Educação</option>
            <option value="Saúde">Saúde</option>
          </select>
        </div>
        <div>
          <label for="local-acao">Local</label>
          <input type="text" id="local-acao" name="local" required>
        </div>
        <div>
          <label for="responsavel-acao">Responsável</label>
          <input type="text" id="responsavel-acao" name="responsavel" required>
        </div>
        <div>
          <label for="participantes-acao">Quantas pessoas participaram?</label>
          <input type="number" id="participantes-acao" name="participantes" min="1" step="1" required>
        </div>
        <div>
          <label for="descricao-acao">O que foi feito?</label>
          <textarea id="descricao-acao" name="descricao" rows="5" required></textarea>
        </div>
        <button type="submit">Cadastrar ação</button>
      </form>
      <div class="container-botao-navegacao">
        <a href="index.html" class="btn-voltar">Voltar para o mural</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Mural comunitário da Vila Nova</p>
  </footer>
</body>
</html>
