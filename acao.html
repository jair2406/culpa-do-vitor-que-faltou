<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Registrar ação · Mural da Vila Nova</title>
</head>
<body>
  <header>
    <div class="cabecalho"><div class="wrap">
      <img src="imagens/colegio-civico-militar-do-parana-logo.png" alt="Logo da escola">
      <div class="marca"><strong>Mural de Ações do Bairro</strong><span>Vila Nova</span></div>
      <img src="imagens/governo_estado.png" alt="Governo do Estado do Paraná">
    </div></div>
    <nav class="menu" aria-label="Principal"><div class="wrap">
      <a href="index.html" >Mural</a>
      <a href="acao.html" aria-current="page">Registrar ação</a>
    </div></nav>
  </header>
  <div class="titulo-pagina"><div class="wrap">
    <h1>Registrar uma ação</h1>
    <p>Preencha os dados abaixo para incluir a ação no mural do bairro.</p>
  </div></div>

  <main class="wrap">
    <form class="form-card" id="formulario-acao" novalidate>
      <fieldset>
        <legend>Sobre a ação</legend>
        <div>
          <label for="titulo-acao">Título da ação</label>
          <input type="text" id="titulo-acao" name="titulo" required maxlength="80">
        </div>
        <div class="linha2">
          <div>
            <label for="categoria-acao">Categoria</label>
            <select id="categoria-acao" name="categoria" required>
              <option value="">Escolha uma categoria</option>
              <option value="Ambiental">Ambiental</option>
              <option value="Social">Social</option>
              <option value="Educação">Educação</option>
              <option value="Saúde">Saúde</option>
            </select>
          </div>
          <div>
            <label for="local-acao">Local</label>
            <input type="text" id="local-acao" name="local" required>
          </div>
        </div>
        <div>
          <label for="descricao-acao">O que foi feito?</label>
          <textarea id="descricao-acao" name="descricao" rows="5" required></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Quem participou</legend>
        <div class="linha2">
          <div>
            <label for="responsavel-acao">Responsável</label>
            <input type="text" id="responsavel-acao" name="responsavel" required>
          </div>
          <div>
            <label for="participantes-acao">Quantas pessoas participaram?</label>
            <input type="number" id="participantes-acao" name="participantes" min="1" step="1" required>
          </div>
        </div>
      </fieldset>

      <div class="rodape-form">
        <button type="submit" class="botao">Cadastrar ação</button>
        <a href="index.html" class="botao voltar">Voltar para o mural</a>
      </div>
    </form>
  </main>

  <footer><div class="wrap">
    <p>P.I.A.S. 2026 · Responsabilidade Social e Sustentabilidade</p>
    <p>Mural comunitário da Vila Nova</p>
  </div></footer>
</body>
</html>
